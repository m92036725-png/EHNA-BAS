<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إحنا بس 🌹</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0709;--bg2:#1a0d11;--bg3:#2c151c;--nav:#080405;--text:#f3e9ec;--muted:#a08a91;--accent:#9b1f40;--accent2:#d13a67;--mine:#5a1226;--g2:#4a1226;--danger:#e5484d;color-scheme:dark}
[data-theme=midnight]{--g2:#12306b;--bg:#0a0e1a;--bg2:#121828;--bg3:#1e2740;--nav:#060912;--accent:#2f5bd6;--accent2:#5b8cff;--mine:#1c3170}
[data-theme=forest]{--g2:#0f4a33;--bg:#08110d;--bg2:#0f1c16;--bg3:#1a3026;--nav:#050b08;--accent:#1d8a5a;--accent2:#3fc388;--mine:#14573a}
[data-theme=violet]{--g2:#4a2a9a;--bg:#120d1f;--bg2:#1c1530;--bg3:#2c2250;--nav:#0b0814;--accent:#7a56ee;--accent2:#d35bd0;--mine:#42308f}
[data-theme=light]{--g2:#f0c4cf;--bg:#f7eef0;--bg2:#fff;--bg3:#ecd9de;--nav:#efe0e4;--text:#2a1016;--muted:#7b6168;--mine:#f3c9d4;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background-color:var(--bg);background-image:linear-gradient(160deg,var(--bg) 0%,var(--g2) 150%);overflow:hidden;overscroll-behavior:none;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:13px}
button,input,select{font:inherit;color:inherit}
button{background:var(--bg3);border:0;border-radius:10px;padding:9px 13px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--bg3);color:var(--muted)}
input,select{background:var(--bg2);border:1px solid var(--bg3);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--accent2)}
.card{background:linear-gradient(145deg,var(--bg2),var(--bg3));border-radius:16px;padding:14px;margin:10px 12px;border:1px solid var(--bg3)}
.card h3{margin:0 0 8px;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input,.row>select{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:44px;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg3);color:var(--muted)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg3)}
.item:last-child{border:0}.item.done b{text-decoration:line-through;opacity:.5}
.cd{color:var(--accent2);font-weight:600;font-size:13px}
.bar{height:8px;border-radius:9px;background:var(--bg3);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* picker */
#pick{height:100vh;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.pick-box{width:min(420px,100%);text-align:center;margin:auto}
.pick-box h1{margin:0 0 4px;font-size:30px}
.who{display:grid;grid-template-columns:1fr 118px 1fr;gap:8px;align-items:center;margin-top:22px}.who img{width:118px;height:118px;object-fit:contain}
.who button{padding:30px 6px;font-size:20px;font-weight:700;border-radius:18px;background:linear-gradient(145deg,var(--bg2),var(--g2));border:1px solid var(--bg3);display:flex;flex-direction:column;gap:8px;align-items:center}
.who button:hover,.who button.sel{border-color:var(--accent2)}#pw-form{margin-top:20px}#pw-form input{text-align:center;margin-bottom:8px}
/* layout */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#nav{display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,var(--nav),var(--g2));padding:10px 6px;width:76px;align-items:center}
#nav button{width:64px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--muted)}
#nav button span{font-size:22px}#nav button small{font-size:11px}
#nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(90deg,var(--bg2),var(--g2));border-bottom:1px solid var(--bg3)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--bg3);display:inline-grid;place-items:center;font-size:20px;vertical-align:middle}
/* chat */
#messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:7px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--bg3);white-space:pre-wrap;word-break:break-word;line-height:1.5}
.msg.mine{align-self:flex-start;background:linear-gradient(135deg,var(--mine),var(--g2));border-color:transparent}.msg.theirs{align-self:flex-end}
.msg .meta{font-size:11px;color:var(--muted);margin-bottom:2px}.msg.em{font-size:38px;line-height:1.2}
#composer{display:flex;gap:6px;padding:8px 10px;background:var(--bg2);align-items:center}
/* watch */
#stage{position:relative;aspect-ratio:16/9;width:100%;max-height:60vh;background:#000;display:grid;place-items:center;text-align:center;color:#aaa}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.themes button{border:2px solid transparent;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px}
.themes button.on{border-color:var(--accent2)}.sw{width:40px;height:24px;border-radius:8px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;z-index:40}
@media (max-width:700px){
#app{flex-direction:column-reverse}
#nav{flex-direction:row;width:100%;justify-content:space-around;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
#nav button{width:auto;flex:1;padding:6px 0}
.msg{max-width:92%}.big{font-size:38px}
}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.grid4 .big{font-size:32px}.grid4 small{color:var(--muted);font-size:12px}
.view>*{flex-shrink:0}#v-chat{overflow:hidden;padding-bottom:0}#messages{min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#tray{flex-shrink:0;background:var(--bg2);border-top:1px solid var(--bg3);padding:6px 8px;max-height:42dvh;overflow-y:auto;overscroll-behavior:contain}
#tabs{display:flex;gap:6px;margin-bottom:6px}#tabs button{flex:1}
#tp{display:flex;flex-wrap:wrap;gap:2px}#tp button.e{background:transparent;font-size:26px;padding:3px 5px}
#tp button.st{width:76px;height:76px;padding:3px}#tp button.st img{width:100%;height:100%;object-fit:contain}#tp button.st.del{outline:2px solid var(--danger)}
.msg.stk{background:none;border:0;padding:0}.msg.stk img{width:130px;height:130px;object-fit:contain;display:block}
.msg audio{display:block;height:38px;width:230px;max-width:100%}
#rec{flex:1;display:flex;gap:10px;align-items:center;color:var(--danger)}#rec i{font-style:normal;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
#composer{flex-shrink:0}#composer>input{min-width:0}

/* ===== Liquid Glass 2027 ===== */
:root{--glass:color-mix(in srgb,var(--bg2) 58%,transparent);--stroke:color-mix(in srgb,var(--text) 13%,transparent);--spring:cubic-bezier(.3,1.5,.5,1)}
html,body{font-family:-apple-system,"SF Pro Display","SF Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;background-image:radial-gradient(90% 60% at 100% 0%,color-mix(in srgb,var(--accent2) 32%,transparent),transparent 70%),radial-gradient(80% 60% at 0% 100%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 70%),linear-gradient(160deg,var(--bg),var(--g2) 170%)}
.card,#topbar,#nav,#composer,#tray,#toast,.chip,.qbar button{-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:26px;padding:16px;box-shadow:inset 0 1px 0 #ffffff1f,0 14px 34px -18px #000a}
.card h3{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.ic{width:24px;height:24px;flex:none}[data-ic]{display:inline-grid;place-items:center}
.hi{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-grid;place-items:center;color:#fff;flex:none}.hi .ic{width:18px;height:18px}
button{border-radius:999px;transition:transform .3s var(--spring),background .2s,opacity .2s}button:active{transform:scale(.92)}
button.primary{box-shadow:0 8px 22px -8px var(--accent2)}
input,select{border-radius:16px;background:color-mix(in srgb,var(--bg) 45%,transparent);border-color:var(--stroke)}
#topbar{background:var(--glass);border:1px solid var(--stroke);border-radius:24px;margin:max(8px,env(safe-area-inset-top)) 12px 4px;padding:8px 14px}
#nav{background:var(--glass);border:1px solid var(--stroke);margin:12px;border-radius:30px;padding:8px;height:fit-content;align-self:center;box-shadow:inset 0 1px 0 #ffffff22,0 18px 40px -16px #000b}
#nav button{border-radius:22px;transition:all .35s var(--spring)}#nav button .ic{width:26px;height:26px}
#nav button.active{box-shadow:0 8px 20px -6px var(--accent2);transform:scale(1.04)}
@media (max-width:700px){#nav{align-self:auto;height:auto;margin:0 12px calc(8px + env(safe-area-inset-bottom));padding:6px;border-radius:32px}}
.msg{border-radius:22px;padding:8px 14px}.msg.med{padding:5px}.msg.med .meta{padding:2px 8px}
.media img,.media video{display:block;max-width:100%;width:260px;border-radius:17px;background:#000}.media img{cursor:zoom-in}
.lb{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:60;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}.lb img{max-width:94vw;max-height:90vh;border-radius:20px}
#composer{margin:4px 10px 8px;border-radius:999px;padding:5px;background:var(--glass);border:1px solid var(--stroke)}
#composer>input,.composer2 input{border:0;background:transparent}
.ib,.send{width:40px;height:40px;padding:0;border-radius:50%;display:inline-grid;place-items:center;flex:none}.ib{background:transparent;color:var(--muted)}
#rec .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
#tray{margin:0 10px 6px;border-radius:24px;border:1px solid var(--stroke)}
#tabs button{display:flex;align-items:center;justify-content:center;gap:6px}
.qbar{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;flex-shrink:0;scrollbar-width:none}.qbar::-webkit-scrollbar{display:none}
.qbar button{font-size:24px;padding:4px 8px;min-width:46px;flex:none;background:var(--glass);border:1px solid var(--stroke)}
#wchat{display:flex;flex-direction:column;height:min(54dvh,480px);padding:12px;overflow:hidden}
#wmsgs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0;overscroll-behavior:contain}
#wchat .qbar{padding:6px 0}
.composer2{display:flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--bg) 50%,transparent);border-radius:999px;padding:5px;border:1px solid var(--stroke)}
.pick-box h1{display:flex;align-items:center;justify-content:center;gap:10px;font-size:32px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px -8px var(--accent2)}.logo .ic{width:23px;height:23px;fill:currentColor}
.chip{display:flex;align-items:center;gap:5px;padding:4px 12px 4px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);font-weight:700}.chip svg{width:19px;height:23px}.chip.off,.chip.none{color:var(--muted)}
.sk{display:flex;gap:14px;align-items:center}.sk-r{flex:1;min-width:0}.sk .big{font-size:50px}.sk-m{margin-top:8px}
.fw{width:112px;height:132px;display:grid;align-items:end;flex:none}.fs{width:100%;transform:scale(var(--sc,1));transform-origin:50% 100%;transition:transform 1s var(--spring)}
.fl{display:block;width:100%;overflow:visible}.fl:not(.off){transform-origin:50% 100%;animation:flick 2s ease-in-out infinite}
.fl.lv1:not(.off){filter:drop-shadow(0 0 8px #ff6a3d88)}.fl.lv2:not(.off){filter:drop-shadow(0 0 14px #ffa03dbb)}.fl.lv3:not(.off){filter:drop-shadow(0 0 22px #ff4fa0cc)}
.sp{animation:tw 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1deg)}50%{transform:scale(1.04,.96) rotate(1.5deg)}}@keyframes tw{50%{opacity:.15}}
.pill.ok{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.pill .ic{width:12px;height:12px;vertical-align:-2px;margin-inline-end:3px}.pill{font-size:13px;padding:4px 11px}
#toast{background:#000a;border:1px solid #ffffff22}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
textarea{background:color-mix(in srgb,var(--bg) 45%,transparent);border:1px solid var(--stroke);border-radius:16px;padding:10px 12px;width:100%;outline:none;font:inherit;color:inherit;margin-top:8px;resize:vertical}
#nav{overflow-y:auto;max-height:calc(100dvh - 24px);scrollbar-width:none}#ot{cursor:pointer;font-size:15px}.lb .small{margin-top:8px}
@media (max-width:700px){#nav{overflow-x:auto;overflow-y:hidden;justify-content:flex-start;max-height:none}#nav button{flex:none;min-width:62px}}

/* ===== v3 ===== */
html,body{font-family:"Tajawal",-apple-system,"SF Arabic",system-ui,"Segoe UI",Tahoma,sans-serif}
.pick-box h1,.big,.hero b{font-family:"Aref Ruqaa","Tajawal",serif;font-weight:700}
.small{font-size:13.5px}#nav button small{font-size:12.5px}.msg .meta{font-size:12px}.grid4 small{font-size:13px}.pill{font-size:13px}
.card{margin:6px 12px}
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.blobs i:nth-child(1){width:300px;height:300px;top:-90px;right:-70px;background:var(--accent2)}
.blobs i:nth-child(2){width:340px;height:340px;bottom:-130px;left:-100px;background:var(--accent)}
.blobs i:nth-child(3){width:220px;height:220px;top:42%;left:35%;background:var(--g2);opacity:.7}
[data-theme=light] .blobs i{opacity:.35}
#pick,#app{position:relative;z-index:1}
.view:not(.hidden){animation:vin .32s ease-out}@keyframes vin{from{opacity:0;transform:translateY(8px)}}
@media(min-width:701px){#app{justify-content:center}main{flex:1;max-width:780px}}
/* nav */
#nav button{min-height:54px}#nav .more{display:none}
@media(max-width:700px){#nav .sec{display:none}#nav .more{display:flex}#nav{overflow:visible;justify-content:space-around}#nav button{min-width:0;flex:1}}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mg button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 4px;border-radius:22px;font-size:13px}.mg .ic{width:26px;height:26px}
/* avatars + status */
.av{width:var(--s,40px);height:var(--s,40px);border-radius:50%;display:inline-grid;place-items:center;background:var(--bg3) center/cover;font-size:calc(var(--s,40px)*.5);flex:none;box-shadow:0 0 0 2px var(--accent2),0 8px 22px -8px var(--accent2)}
.chip .av{box-shadow:none}.avatar.hp{color:transparent;background-size:cover;background-position:center}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84;flex:none}.sd.off{background:var(--muted);box-shadow:none;opacity:.6}
/* home */
.hero{text-align:center;padding:20px 16px}.hr{display:flex;align-items:center;justify-content:center;gap:16px}
.hw{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:90px}.hw b{font-size:22px}.hw .small{display:flex;align-items:center;gap:5px}
.hr>span .ic{width:30px;height:30px;color:var(--accent2);fill:var(--accent2);animation:hb 2.6s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}12%{transform:scale(1.18)}24%{transform:scale(1)}36%{transform:scale(1.12)}}
.grid4{grid-template-columns:repeat(3,1fr)}.grid4 .big{font-size:30px}.grid4>div:first-child{grid-column:1/-1}.grid4>div:first-child .big{font-size:72px}.grid4>div:first-child small{font-size:15px}
/* chat */
.msg.mine{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-end-start-radius:6px}.msg.theirs{border-end-end-radius:6px}
.msg.stk.mine{background:none}.msg.mine .meta{color:#ffffffb8}
.msg .meta{display:flex;align-items:center;gap:4px}
.msg .del{background:none;padding:4px 6px;margin:-4px 0 -4px -4px;margin-inline-start:6px;color:inherit;opacity:.65;border-radius:8px}.msg .del .ic{width:14px;height:14px}
.dsep{align-self:center;font-size:12.5px;color:var(--muted);padding:3px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--stroke);margin:6px 0}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 10px}.empty .ic{width:38px;height:38px;color:var(--accent2);opacity:.85}.empty b{font-size:15px}#messages>.empty,#wmsgs>.empty{margin:auto}
/* watch */
#stage{width:auto;margin:6px 12px;border-radius:26px;overflow:hidden;background:linear-gradient(145deg,var(--bg2),var(--g2));border:1px solid var(--stroke);color:var(--muted)}
#w-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;font-size:14px}#w-empty .ic{width:44px;height:44px;color:var(--accent2)}
/* settings */
.sw{width:58px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;border:1px solid var(--stroke)}.themes button.on .sw::after{content:"✓"}
.pbox{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
/* login */
.pick-box{position:relative;z-index:1;animation:pin .7s cubic-bezier(.2,.9,.3,1) both}@keyframes pin{from{opacity:0;transform:translateY(14px) scale(.97)}}
.who img{filter:drop-shadow(0 10px 26px color-mix(in srgb,var(--accent2) 60%,transparent));animation:flt 5s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-7px)}}
.who button .av{--s:56px}
#pw-forgot{width:auto!important;background:none;border:0;color:var(--muted);font-size:13.5px;text-decoration:underline;padding:6px 10px}
.hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none}.hearts i{position:absolute;bottom:-30px;color:var(--accent2);opacity:0;font-style:normal;animation:rise linear infinite}
@keyframes rise{10%{opacity:.35}90%{opacity:.2}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>

<div id="pick">
  <div class="pick-box">
    <h1><span class="logo" data-ic="heart"></span>إحنا بس</h1>
    <p class="muted">المكان بتاعنا احنا الاتنين بس. مين اللي داخل؟</p>
